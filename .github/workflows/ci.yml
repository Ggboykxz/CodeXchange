name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : les runs en cours sont annulés
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tests, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL : le provider Prisma est `postgresql` (SQLite ne fonctionne
    # pas sur Vercel — disque des fonctions en lecture seule). Le service est
    # en bonne santé avant l'étape `prisma db push` grâce au health check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cx
          POSTGRES_PASSWORD: cx_local_dev
          POSTGRES_DB: codexchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cx:cx_local_dev@127.0.0.1:5432/codexchange

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun.lock est le lockfile canonique (package-lock.json est gitignoré)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node requis pour les binaires Prisma / Next
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # DATABASE_URL doit exister pour `next build` (l'URL Postgres du service
      # ci-dessus prime sur .env : Next et Prisma ne l'écrasent jamais)
      - name: Create .env
        run: cp .env.example .env

      - name: Prisma db push
        run: bunx prisma db push

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      # Posé avant typecheck/build : la suite dure moins d'une seconde et
      # ne dépend ni de `next typegen` ni de la base — autant échouer tôt.
      # Aucun test n'importe `lib/db` : le seed n'est jamais touché.
      - name: Test
        run: bun run test

      # next-env.d.ts et .next/types sont gitignorés : les générer avant tsc
      # (documenté — `next build` les régénère aussi, mais après le typecheck)
      - name: Generate Next.js types
        run: bunx next typegen

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # ---------------------------------------------------------------- #
      # E2E Playwright (J7) : on seed la base du service, on sert le build  #
      # de production (`next start`) et on exécute les scénarios de tests/e2e.#
      # ---------------------------------------------------------------- #
      - name: Seed CI database
        run: npx tsx scripts/seed.ts

      - name: Install Playwright Chromium (+ deps système)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npx playwright test
