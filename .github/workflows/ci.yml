name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    env:
      # Base SQLite éphémère de la runner — `.env` n'est pas versionné.
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Générer le client Prisma
        run: npx prisma generate
      - name: Appliquer les migrations
        run: npx prisma migrate deploy
      - name: Lint (bloquant)
        run: npm run lint
      - name: Tests (bloquant)
        run: npm test
